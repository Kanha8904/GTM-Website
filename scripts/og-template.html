<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:J;src:url(../public/fonts/jakarta.woff2)}@font-face{font-family:I;src:url(../public/fonts/inter.woff2)}
*{margin:0;box-sizing:border-box}body{width:1200px;height:630px;overflow:hidden;font-family:J,sans-serif;color:#F4F6FF;

svg{position:absolute;right:40px;top:120px;width:400px}
