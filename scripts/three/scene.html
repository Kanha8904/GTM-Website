<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./addons/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const which = new URLSearchParams(location.search).get('s');
const W = 1200, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4, 9, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 8; key.shadow.camera.left = -8; key.shadow.camera.right = 8; key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
scene.add(key, new THREE.AmbientLight(0xffffff, 0.35));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.12 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const mat = (hex, o = {}) => new THREE.MeshPhysicalMaterial({ color: hex, roughness: 0.28, metalness: 0.05, clearcoat: 0.8, clearcoatRoughness: 0.15, ...o });
const RED = 0xE10600, BLUE = 0x0066FF, NAVY = 0x0B2A6B, SILVER = 0xE8ECF2, WHITE = 0xffffff;
const add = (geo, m, x, y, z, ry = 0) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.rotation.y = ry; o.castShadow = o.receiveShadow = true; scene.add(o); return o; };

if (which === 'pipeline') {
  // 8 stages; stages 2, 3 and 6 are human gates (red)
  const gates = new Set([1, 2, 5]);
  const g = new RoundedBoxGeometry(1, 1, 1, 6, 0.16);
  for (let i = 0; i < 8; i++) {
    const t = i / 7, x = -5.25 + i * 1.5, h = 0.6 + t * 1.5;
    const m = gates.has(i) ? mat(RED) : (i === 7 ? mat(BLUE) : mat(i % 2 ? SILVER : WHITE));
    const box = add(g, m, x, h / 2, Math.sin(t * Math.PI) * -1.2, 0); box.scale.set(1, h, 1);
  }
  const path = new THREE.CatmullRomCurve3([...Array(8)].map((_, i) => new THREE.Vector3(-5.25 + i * 1.5, 0.04, Math.sin(i / 7 * Math.PI) * -1.2 + 0.85)));
  add(new THREE.TubeGeometry(path, 120, 0.05, 12), mat(NAVY), 0, 0, 0);
  cam.position.set(0, 8.5, 19); cam.lookAt(0, 0.6, -0.4);
} else if (which === 'target') {
  const rings = [[2.6, WHITE], [2.0, SILVER], [1.4, BLUE], [0.8, WHITE], [0.35, RED]];
  rings.forEach(([r, c], i) => { const cyl = add(new THREE.CylinderGeometry(r, r, 0.35 + i * 0.12, 96), mat(c), 0, (0.35 + i * 0.12) / 2, 0); });
  // arrow: shaft + head hitting the centre
  const arrow = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 3.4, 24), mat(NAVY)); shaft.position.y = 1.7;
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 32), mat(NAVY)); head.rotation.x = Math.PI; head.position.y = 0.05;
  const fl = new THREE.Mesh(new RoundedBoxGeometry(0.5, 0.6, 0.04, 2, 0.02), mat(RED)); fl.position.y = 3.2;
  const fl2 = fl.clone(); fl2.rotation.y = Math.PI / 2;
  [shaft, head, fl, fl2].forEach(o => { o.castShadow = true; arrow.add(o); });
  arrow.position.set(0, 0.84, 0); arrow.rotation.z = -0.6; arrow.rotation.x = 0.25; scene.add(arrow); // tip sits on the bullseye
  cam.position.set(0, 8.5, 9); cam.lookAt(0.3, 0.6, 0);
} else if (which === 'layers') {
  const slabs = [[RED, 0.0], [WHITE, 0.62], [BLUE, 1.24], [SILVER, 1.86], [NAVY, 2.48]];
  const g = new RoundedBoxGeometry(3.6, 0.38, 2.6, 6, 0.14);
  slabs.forEach(([c, y], i) => add(g, mat(c), (i % 2 ? 0.25 : -0.15), 0.19 + y, 0, (i - 2) * 0.12));
  cam.position.set(6.5, 6.2, 8.5); cam.lookAt(0, 1.3, 0);
}
renderer.render(scene, cam);
window.__done = true;
</script></body></html>
